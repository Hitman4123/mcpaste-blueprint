# Every push and pull request: the package builds, and the PHP parses.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Checks conf.yml and Components.yml, then packs dist/mcpaste.blueprint.
      - run: node scripts/build.mjs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      # Lint the PHP as Blueprint installs it: {identifier} is filled in
      # first, since a namespace or class name with it isn't valid PHP yet.
      - name: PHP syntax
        run: |
          status=0
          mkdir -p "$RUNNER_TEMP/php"
          while IFS= read -r file; do
            out="$RUNNER_TEMP/php/$(echo "$file" | tr '/' '_')"
            sed 's/{identifier}/mcpaste/g' "$file" > "$out"
            php -l "$out" >/dev/null || { echo "::error file=$file::PHP syntax error"; status=1; }
          done < <(find extension -name '*.php')
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: mcpaste.blueprint
          path: |
            dist/mcpaste.blueprint
            dist/mcpaste.blueprint.json
